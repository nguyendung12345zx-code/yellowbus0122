<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Learning Pro (V50 - Mobile Perfect)</title>
    <style>
        /* === 样式区 === */
        :root { --primary: #2979FF; --bg-grey: #F5F7FA; --text-main: #333; --green: #4CAF50; }
        body { margin: 0; font-family: "Comic Sans MS", -apple-system, sans-serif; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: var(--text-main); }
        
        /* ★ 修复1：顶部栏固定增强 */
        header { 
            height: 50px; background: white; border-bottom: 1px solid #E0E0E0; 
            display: flex; align-items: center; padding: 0 10px; gap: 8px; 
            flex-shrink: 0; /* 禁止缩小 */
            position: relative; 
            z-index: 50; /* 确保层级高于内容 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* 加个阴影区分内容 */
            overflow-x: auto; /* 防止按钮太多溢出 */
        }
        
        .back-btn { border: 1px solid #ddd; background: white; padding: 4px 10px; border-radius: 20px; cursor: pointer; color: #555; font-size: 12px; white-space: nowrap; }
        .nav-group { display: flex; align-items: center; gap: 4px; border-right: 1px solid #eee; padding-right: 8px; margin-right: 4px; }
        .speed-btn { border: 1px solid #ddd; background: #f9f9f9; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; min-width: 30px; }
        .speed-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        #play-all-btn { background: var(--green); color: white; border: 1px solid var(--green); font-weight: bold; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        #play-all-btn.playing { background: #E53935; border-color: #E53935; }

        /* 主容器 */
        #main-container { display: flex; flex: 1; overflow: hidden; flex-direction: column; position: relative; }
        
        #col-left { flex: 0 0 30%; background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; border-bottom: 1px solid #eee; }
        #scene-img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1)); }
        
        /* 中间文段 */
        #col-mid { flex: 1; background: var(--bg-grey); overflow-y: auto; padding: 15px; transition: flex 0.3s; }
        
        /* ★ 修复2：右侧/底部 词汇表滚动修复 */
        #col-right { 
            display: flex; flex-direction: column; 
            flex: 0 0 30%; /* 手机默认高度 30% */
            background: white; border-top: 2px solid #FFD54F; z-index: 10; 
            transition: flex 0.3s ease; 
            overflow: hidden; /* 关键：限制内部溢出，强制让内部的list滚动 */
            min-height: 0; /* Flex布局滚动bug修复 */
        }
        
        /* PC端适配 */
        @media (min-width: 768px) {
            header { height: 60px; padding: 0 20px; }
            #main-container { flex-direction: row; }
            #col-left { flex: 0 0 400px; height: 100%; border-right: 1px solid #ddd; border-bottom: none; }
            #col-mid { flex: 1; border-right: 1px solid #ddd; }
            #col-right { flex: 0 0 300px; height: 100%; border-top: none; }
        }

        .script-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .script-card.active { border-color: var(--primary); background: #E3F2FD; transform: scale(1.02); }
        .en-text { font-size: 18px; font-weight: 500; line-height: 1.5; margin-bottom: 8px; color: #222; }
        .cn-text { font-size: 14px; color: #666; margin-bottom: 5px; }
        .highlight-word { color: #00897B; border-bottom: 2px solid #4DB6AC; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .highlight-word:active { color: #E91E63; } 

        .vocab-header-container { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #FAFAFA; border-bottom: 1px solid #eee; flex-shrink: 0; /* 标题栏不准缩小 */ }
        .vocab-header-text { font-weight: bold; font-size: 14px; color: #333; flex: 1; text-align: center; cursor: pointer; user-select: none; }
        .toggle-btn { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; color: #555; }
        
        /* 单词列表滚动增强 */
        .vocab-list { 
            flex: 1; 
            overflow-y: auto; /* 开启垂直滚动 */
            padding: 10px; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* iOS 丝滑滚动 */
        }
        
        .vocab-card { border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #fff; border-left: 4px solid #ddd; cursor: pointer; }
        .vocab-card.focused { border-left-color: #FF9800 !important; background-color: #FFF3E0 !important; transform: translateX(5px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .vocab-top { display: flex; justify-content: space-between; align-items: center; }
        .vocab-word { font-size: 18px; font-weight: bold; color: #333; }
        .vocab-mask { margin-top: 5px; font-size: 12px; color: #999; background: #f5f5f5; padding: 4px; text-align: center; }
        .vocab-reveal { display: none; margin-top: 5px; padding-top: 5px; border-top: 1px solid #f0f0f0; font-size: 14px; }
        .vocab-card.revealed .vocab-mask { display: none; }
        .vocab-card.revealed .vocab-reveal { display: block; }
        
        .section-divider { text-align: center; margin: 30px 0 20px 0; color: #888; font-size: 14px; }
        .quiz-card { background: #FFF3E0; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 2px dashed #FFB74D; }
        .quiz-opt { background: white; border: 1px solid #FFCC80; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .quiz-opt.correct { background: #C8E6C9; border-color: #4CAF50; }
        .quiz-opt.wrong { background: #FFCDD2; border-color: #F44336; }
        .quiz-opt::after { content: ''; font-weight: bold; font-size: 18px; margin-left: 10px; }
        .quiz-opt.correct::after { content: '✅'; color: #2E7D32; }
        .quiz-opt.wrong::after { content: '❌'; color: #C62828; }
        .audio-btn { border: 1px solid var(--primary); background-color: white; color: var(--primary); border-radius: 6px; padding: 4px 10px; margin-left: 10px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
        .audio-btn:active { background-color: #E3F2FD; transform: scale(0.95); }
        
        #login-overlay, #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #login-overlay { background: #2979FF; z-index: 9999; }
        #start-overlay { background: rgba(255,255,255, 0.95); backdrop-filter: blur(5px); }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #f9f9f9; outline: none; }
        .login-input:focus { border-color: #2979FF; background: white; }
        .login-btn { width: 100%; padding: 12px; background: #2979FF; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .big-start-btn { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 24px; font-weight: bold; box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4); cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-top:0; color:#2979FF;">🔐 学员登录</h2>
            <input type="text" id="username-input" class="login-input" placeholder="账号 (vip1)">
            <input type="password" id="password-input" class="login-input" placeholder="密码 (123456)">
            <button class="login-btn" onclick="checkAccountLogin()">登录</button>
            <p id="login-msg" style="color:red; font-size:13px; margin-top:10px; min-height:20px;"></p>
        </div>
        <p style="margin-top:20px; font-size:12px; opacity:0.7; color:white;">Magic Learning Pro V50</p>
    </div>

    <div id="menu-screen" style="padding:40px; text-align:center;">
        <h2>📚 魔法精读 (V50)</h2>
        <div onclick="openBook()" style="background:white; display:inline-block; padding:20px; border-radius:15px; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.1); max-width: 320px;">
            <img id="cover-img" src="images/story001_yellowbus/p1.jpg" style="background-color:#eee; border-radius:10px; margin-bottom:10px; width: 100%; height: auto; min-height: 200px; object-fit: cover; aspect-ratio: 4/3;">
            <h3>The Yellow Bus</h3>
            <p style="color:#666; font-size:12px;">点击封面进入</p>
        </div>
    </div>

    <div id="learning-screen" style="display:none; height:100vh; flex-direction:column;">
        <div id="start-overlay">
            <div style="font-size:60px; margin-bottom:20px;">🚌</div>
            <button class="big-start-btn" onclick="startStory()">✨ Start Story ✨</button>
        </div>

        <header>
            <div class="nav-group" style="border:none;">
                <button class="back-btn" onclick="location.reload()">⬅ 书架</button>
            </div>
            <div class="nav-group" style="border:none;">
                <button class="speed-btn" onclick="setSpeed(0.5)">0.5</button>
                <button class="speed-btn" onclick="setSpeed(0.75)">0.75</button>
                <button class="speed-btn active" onclick="setSpeed(1.0)">1.0</button>
            </div>
            <button id="play-all-btn" class="speed-btn" onclick="toggleAutoPlay()">▶ 全文</button>
        </header>

        <div id="main-container">
            <div id="col-left">
                <img id="scene-img" src="" style="background-color:#eee;" onerror="this.alt='图片未找到'">
            </div>
            <div id="col-mid"></div>
            
            <div id="col-right">
                <div class="vocab-header-container">
                    <div id="vocab-header-el" class="vocab-header-text" onclick="toggleVocabMode()" title="切换全书/当前">🔑 核心词汇 (点击全显)</div>
                    <button id="toggle-vocab-btn" class="toggle-btn" onclick="toggleVocabVisibility()" title="隐藏/显示">➖</button>
                </div>
                <div class="vocab-list" id="vocab-container"></div>
            </div>
        </div>
    </div>

<script>
    const USER_DATABASE = { "vip1": "123456", "vip2": "123456", "student": "888888", "class01": "000000" };
    let mp3Player = new Audio();
    let currentRate = 1.0;
    let isAutoPlaying = false; 
    let currentIndex = 0; 
    let isFullVocabMode = false;
    const AUDIO_BASE = "images/story001_yellowbus/";
    
    /* ================= 数据源 ================= */
    const storyData = {
        title: "The Yellow Bus",
        paragraphs: [
            {
                text: "I go to {school} by the {yellow} {bus} every {morning}. It is a {big} and {long} car.",
                cn: "我每天早上坐黄色校车去上学。它是一辆又大又长的车。",
                img: AUDIO_BASE + "p1.jpg", 
                audio: AUDIO_BASE + "p1.mp3", 
                vocab: { 
                    "school": { ph: "/skuːl/", pos: "n.", cn: "学校", audio: AUDIO_BASE + "v_school.mp3" },
                    "yellow": { ph: "/ˈjel.oʊ/", pos: "adj.", cn: "黄色的", audio: AUDIO_BASE + "v_yellow.mp3" },
                    "bus": { ph: "/bʌs/", pos: "n.", cn: "公共汽车", audio: AUDIO_BASE + "v_bus.mp3" },
                    "morning": { ph: "/ˈmɔːr.nɪŋ/", pos: "n.", cn: "早晨", audio: AUDIO_BASE + "v_morning.mp3" },
                    "big": { ph: "/bɪɡ/", pos: "adj.", cn: "大的", audio: AUDIO_BASE + "v_big.mp3" },
                    "long": { ph: "/lɑːŋ/", pos: "adj.", cn: "长的", audio: AUDIO_BASE + "v_long.mp3" }
                }
            },
            {
                text: "The {driver} is Mr. Brown. He is very {nice} to us.",
                cn: "司机是布朗先生，他对我们很友善。",
                img: AUDIO_BASE + "p2.jpg",
                audio: AUDIO_BASE + "p2.mp3",
                vocab: { 
                    "driver": { ph: "/ˈdraɪ.vɚ/", pos: "n.", cn: "司机", audio: AUDIO_BASE + "v_driver.mp3" },
                    "nice": { ph: "/naɪs/", pos: "adj.", cn: "友好的", audio: AUDIO_BASE + "v_nice.mp3" }
                }
            },
            {
                text: "I {wait} for the bus at the bus {stop}. When the {door} {opens}, I see my {friends} {inside}.",
                cn: "我在车站等车。当车门打开时，我看到我的朋友们在里面。",
                img: AUDIO_BASE + "p3.jpg",
                audio: AUDIO_BASE + "p3.mp3",
                vocab: { 
                    "wait": { ph: "/weɪt/", pos: "v.", cn: "等待", audio: AUDIO_BASE + "v_wait.mp3" },
                    "stop": { ph: "/stɑːp/", pos: "n.", cn: "车站", audio: AUDIO_BASE + "v_stop.mp3" },
                    "door": { ph: "/dɔːr/", pos: "n.", cn: "门", audio: AUDIO_BASE + "v_door.mp3" },
                    "opens": { ph: "/ˈoʊ.pənz/", pos: "v.", cn: "打开", audio: AUDIO_BASE + "v_opens.mp3" },
                    "friends": { ph: "/frendz/", pos: "n.", cn: "朋友", audio: AUDIO_BASE + "v_friends.mp3" },
                    "inside": { ph: "/ɪnˈsaɪd/", pos: "adv.", cn: "在里面", audio: AUDIO_BASE + "v_inside.mp3" }
                }
            },
            {
                text: "We {sit} together and {look} out the {window}. We {talk} and {laugh} {happily}.",
                cn: "我们坐在一起看窗外。我们开心地说话大笑。",
                img: AUDIO_BASE + "p4.jpg",
                audio: AUDIO_BASE + "p4.mp3",
                vocab: { 
                    "sit": { ph: "/sɪt/", pos: "v.", cn: "坐", audio: AUDIO_BASE + "v_sit.mp3" },
                    "look": { ph: "/lʊk/", pos: "v.", cn: "看", audio: AUDIO_BASE + "v_look.mp3" },
                    "window": { ph: "/ˈwɪn.doʊ/", pos: "n.", cn: "窗户", audio: AUDIO_BASE + "v_window.mp3" },
                    "talk": { ph: "/tɑːk/", pos: "v.", cn: "说话", audio: AUDIO_BASE + "v_talk.mp3" },
                    "laugh": { ph: "/læf/", pos: "v.", cn: "笑", audio: AUDIO_BASE + "v_laugh.mp3" },
                    "happily": { ph: "/ˈhæp.əl.i/", pos: "adv.", cn: "快乐地", audio: AUDIO_BASE + "v_happily.mp3" }
                }
            },
            {
                text: "The bus {ride} is {safe} and {fun}. I {love} the yellow bus.",
                cn: "坐校车既安全又有趣。我爱黄色校车。",
                img: AUDIO_BASE + "p5.jpg",
                audio: AUDIO_BASE + "p5.mp3",
                vocab: { 
                    "ride": { ph: "/raɪd/", pos: "n.", cn: "旅程/乘车", audio: AUDIO_BASE + "v_ride.mp3" },
                    "safe": { ph: "/seɪf/", pos: "adj.", cn: "安全的", audio: AUDIO_BASE + "v_safe.mp3" },
                    "fun": { ph: "/fʌn/", pos: "adj.", cn: "有趣的", audio: AUDIO_BASE + "v_fun.mp3" },
                    "love": { ph: "/lʌv/", pos: "v.", cn: "爱", audio: AUDIO_BASE + "v_love.mp3" }
                }
            }
        ],
        quizzes: [
            { 
                question: "What color is the bus?", 
                options: ["Red", "Yellow", "Blue"], 
                answer: 1, 
                audio: AUDIO_BASE + "q_1.mp3",
                optionAudios: [ AUDIO_BASE + "q_1_opt_0.mp3", AUDIO_BASE + "q_1_opt_1.mp3", AUDIO_BASE + "q_1_opt_2.mp3" ]
            },
            { 
                question: "Who is the driver?", 
                options: ["Mr. Green", "Mr. Brown", "Mr. Black"], 
                answer: 1, 
                audio: AUDIO_BASE + "q_2.mp3",
                optionAudios: [ AUDIO_BASE + "q_2_opt_0.mp3", AUDIO_BASE + "q_2_opt_1.mp3", AUDIO_BASE + "q_2_opt_2.mp3" ]
            },
            { 
                question: "Are they happy on the bus?", 
                options: ["Yes", "No"], 
                answer: 0, 
                audio: AUDIO_BASE + "q_3.mp3",
                optionAudios: [ AUDIO_BASE + "q_3_opt_0.mp3", AUDIO_BASE + "q_3_opt_1.mp3" ]
            }
        ]
    };

    /* ================= 业务逻辑 ================= */

    function checkAccountLogin() {
        const userIn = document.getElementById('username-input').value.trim();
        const passIn = document.getElementById('password-input').value.trim();
        const msg = document.getElementById('login-msg');
        if (USER_DATABASE[userIn] && USER_DATABASE[userIn] === passIn) {
            localStorage.setItem('magic_user_account', userIn);
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            msg.innerText = "❌ 账号或密码错误";
        }
    }

    window.onload = function() {
        if (localStorage.getItem('magic_user_account') && USER_DATABASE[localStorage.getItem('magic_user_account')]) {
            document.getElementById('login-overlay').style.display = 'none';
        }
        setRandomCoverImage();
    };

    function setRandomCoverImage() {
        const coverImg = document.getElementById('cover-img');
        if (!coverImg || !storyData.paragraphs.length) return;
        const storyImages = storyData.paragraphs.map(p => p.img);
        coverImg.src = storyImages[Math.floor(Math.random() * storyImages.length)];
    }

    function openBook() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('learning-screen').style.display = 'flex';
        document.getElementById('start-overlay').style.display = 'flex';
        renderContent();
        activateParagraphUI(0);
    }

    // 1. 折叠功能
    function toggleVocabVisibility() {
        const vocabContainer = document.getElementById('vocab-container');
        const colRight = document.getElementById('col-right');
        const btn = document.getElementById('toggle-vocab-btn');
        
        if (vocabContainer.style.display === 'none') {
            vocabContainer.style.display = 'block';
            btn.innerText = '➖';
            colRight.style.flex = ''; 
        } else {
            vocabContainer.style.display = 'none';
            btn.innerText = '➕';
            colRight.style.flex = '0 0 auto';
        }
    }

    // 2. 全显功能
    function toggleVocabMode() {
        if (isFullVocabMode) {
            isFullVocabMode = false;
            updateSidebar(currentIndex); 
        } else {
            isFullVocabMode = true;
            renderAllVocab();
        }
    }

    function renderAllVocab() {
        const container = document.getElementById('vocab-container');
        const header = document.getElementById('vocab-header-el');
        header.innerText = "🔓 全书词汇 (已全部加载，点击恢复)";
        header.style.color = "#4CAF50";
        container.innerHTML = "";
        storyData.paragraphs.forEach(para => {
            for (let [word, info] of Object.entries(para.vocab)) {
                let card = createVocabCard(word, info);
                card.classList.add('revealed');
                container.appendChild(card);
            }
        });
    }

    function startStory() {
        document.getElementById('start-overlay').style.display = 'none';
        mp3Player.src = ""; mp3Player.play().catch(()=>{}); 
        isAutoPlaying = true;
        updatePlayButtonUI();
        playNextParagraph(0);
    }

    function renderContent() {
        const container = document.getElementById('col-mid');
        container.innerHTML = "";
        storyData.paragraphs.forEach((para, idx) => {
            let card = document.createElement('div');
            card.className = 'script-card';
            card.id = `para-${idx}`;
            card.onclick = (e) => {
                if(!e.target.classList.contains('highlight-word')) {
                    handleParagraphClick(idx);
                }
            };
            let htmlText = para.text.replace(/{(\w+)}/g, (match, word) => `<span class="highlight-word" onclick="handleWordClick('${word}', ${idx}, event)">${word}</span>`);
            card.innerHTML = `<div class="en-text">${htmlText}</div><div class="cn-text">${para.cn}</div>`;
            container.appendChild(card);
        });
        
        let divider = document.createElement('div');
        divider.className = 'section-divider';
        divider.innerText = "——— ✨ Quiz Time (互动挑战) ✨ ———";
        container.appendChild(divider);

        storyData.quizzes.forEach((quiz, qIdx) => {
            let qCard = document.createElement('div');
            qCard.className = 'quiz-card';
            qCard.innerHTML = `
                <div style="font-weight:bold;color:#EF6C00;margin-bottom:8px;">Question ${qIdx + 1}</div>
                <div style="display:flex; align-items:center; margin-bottom:10px;">
                    <div style="font-weight:bold; flex:1; font-size:16px;">${quiz.question}</div>
                    <button class="audio-btn" onclick="handleQuestionClick(${qIdx})">🔊 听题</button>
                </div>
                <div>
                    ${quiz.options.map((opt, oIdx) => {
                        let optAudio = (quiz.optionAudios && quiz.optionAudios[oIdx]) ? quiz.optionAudios[oIdx] : '';
                        return `<div class="quiz-opt" onclick="checkAnswer(this, ${oIdx}, ${quiz.answer}, '${optAudio}')"><span>${opt}</span></div>`;
                    }).join('')}
                </div>
            `;
            container.appendChild(qCard);
        });
        let spacer = document.createElement('div');
        spacer.style.height = "50px";
        container.appendChild(spacer);
    }

    /* === 播放核心 === */
    function playMp3(url, onEndCallback) {
        stopAllSound(false);
        if(!url) {
            if(onEndCallback) onEndCallback();
            return;
        }
        mp3Player.src = url;
        mp3Player.playbackRate = currentRate;
        mp3Player.play().catch(e => { console.log("Play Fail:", e); });
        
        mp3Player.onended = () => { if(onEndCallback) onEndCallback(); };
        mp3Player.onerror = () => { console.log("MP3 Error"); };
    }

    function stopAllSound(resetAutoPlay = true) {
        if(resetAutoPlay) isAutoPlaying = false;
        mp3Player.pause();
        updatePlayButtonUI();
    }

    function activateParagraphUI(idx) {
        currentIndex = idx;
        document.querySelectorAll('.script-card').forEach(el => el.classList.remove('active'));
        const activeCard = document.getElementById(`para-${idx}`);
        if(activeCard) {
            activeCard.classList.add('active');
            activeCard.scrollIntoView({behavior: "smooth", block: "center"});
        }
        if(storyData.paragraphs[idx]) document.getElementById('scene-img').src = storyData.paragraphs[idx].img;
        
        if(!isFullVocabMode) updateSidebar(idx);
    }

    function playNextParagraph(idx) {
        if (!isAutoPlaying || idx >= storyData.paragraphs.length) {
            stopAllSound();
            return;
        }
        activateParagraphUI(idx);
        let p = storyData.paragraphs[idx];
        playMp3(p.audio, () => {
            if(isAutoPlaying) setTimeout(() => playNextParagraph(idx + 1), 500);
        });
    }

    function handleParagraphClick(idx) {
        stopAllSound(true); 
        activateParagraphUI(idx);
        playMp3(storyData.paragraphs[idx].audio, null);
    }

    function handleWordClick(word, paraIdx, event) {
        event.stopPropagation();
        stopAllSound(true);
        activateParagraphUI(paraIdx); 
        
        let audioUrl = null;
        const paraData = storyData.paragraphs[paraIdx];
        if (paraData && paraData.vocab && paraData.vocab[word]) {
            audioUrl = paraData.vocab[word].audio;
        } else {
            for(let p of storyData.paragraphs) {
                if(p.vocab && p.vocab[word]) { audioUrl = p.vocab[word].audio; break; }
            }
        }
        
        const vocabContainer = document.getElementById('vocab-container');
        if(vocabContainer.style.display === 'none') toggleVocabVisibility();

        const vocabCard = document.getElementById(`vocab-card-${word}`);
        if(vocabCard) {
            document.querySelectorAll('.vocab-card').forEach(el => el.classList.remove('focused'));
            if (!vocabCard.classList.contains('revealed')) vocabCard.classList.add('revealed');
            vocabCard.classList.add('focused');
            vocabCard.scrollIntoView({behavior: "smooth", block: "center"});
        }
        playMp3(audioUrl, null);
    }

    function createVocabCard(word, info) {
        let card = document.createElement('div');
        card.className = 'vocab-card';
        card.id = `vocab-card-${word}`;
        card.onclick = function() {
            stopAllSound(true);
            document.querySelectorAll('.vocab-card').forEach(el => el.classList.remove('focused'));
            this.classList.add('focused');
            if (!this.classList.contains('revealed')) this.classList.add('revealed');
            playMp3(info.audio, null);
        };
        card.innerHTML = `<div class="vocab-top"><div><span class="vocab-word">${word}</span> <span style="font-size:12px;color:#888;">${info.ph}</span></div><button style="border:none;background:none;color:#2979FF;" onclick="event.stopPropagation(); stopAllSound(true); playMp3('${info.audio}', null)">🔊</button></div><div class="vocab-mask">点击查看</div><div class="vocab-reveal"><span class="pos-tag">${info.pos}</span> ${info.cn}</div>`;
        return card;
    }

    function handleQuestionClick(qIdx) {
        stopAllSound(true);
        const quiz = storyData.quizzes[qIdx];
        const allQuizCards = document.querySelectorAll('.quiz-card');
        if(allQuizCards[qIdx]) {
            const options = allQuizCards[qIdx].querySelectorAll('.quiz-opt');
            options.forEach(opt => opt.classList.remove('correct', 'wrong'));
        }
        playMp3(quiz.audio, null);
    }
    
    window.checkAnswer = function(el, selIdx, ansIdx, audioUrl) {
        stopAllSound(true);
        playMp3(audioUrl, null);
        if(selIdx === ansIdx) { el.classList.add('correct'); el.classList.remove('wrong'); }
        else { el.classList.add('wrong'); el.classList.remove('correct'); }
    }

    function toggleAutoPlay() {
        if (isAutoPlaying) stopAllSound();
        else {
            isAutoPlaying = true;
            updatePlayButtonUI();
            playNextParagraph(0);
        }
    }

    function updatePlayButtonUI() {
        const btn = document.getElementById('play-all-btn');
        if(isAutoPlaying) { btn.innerHTML = "⏹"; btn.classList.add('playing'); } 
        else { btn.innerHTML = "▶ 全文"; btn.classList.remove('playing'); }
    }

    function updateSidebar(idx) {
        const container = document.getElementById('vocab-container');
        const header = document.getElementById('vocab-header-el');
        
        container.innerHTML = "";
        header.innerText = "🔑 核心词汇 (点击全显)";
        header.style.color = "#333";

        const vocabMap = storyData.paragraphs[idx].vocab;
        for (let [word, info] of Object.entries(vocabMap)) {
            let card = createVocabCard(word, info);
            container.appendChild(card);
        }
    }

    function setSpeed(rate) {
        currentRate = rate;
        mp3Player.playbackRate = rate;
        document.querySelectorAll('.speed-btn').forEach(btn => {
            if (parseFloat(btn.innerText) === rate) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    window.revealAllVocab = function() {
        const container = document.getElementById('vocab-container');
        document.getElementById('vocab-header-el').innerText = "🔓 全书词汇 (已全部加载)";
        document.getElementById('vocab-header-el').style.color = "#4CAF50";
        container.innerHTML = "";
        storyData.paragraphs.forEach(para => {
            for (let [word, info] of Object.entries(para.vocab)) {
                let card = createVocabCard(word, info);
                card.classList.add('revealed');
                container.appendChild(card);
            }
        });
    }
</script>
</body>
</html>
